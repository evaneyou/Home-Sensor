name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server (API)
        - Dashboard
        - Pi agent (monitor)
        - WireGuard / enrollment
        - Docker Compose / install
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Contents of the `VERSION` file, or the commit SHA.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, Raspberry Pi model and OS, browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `docker compose logs` or `journalctl -u monitor`. Remove secrets first.
      render: shell
