  <text x="893" y="276" fill="#f5d48a" font-family="Nunito, sans-serif" font-size="13">10.7.1.1 · UDP 51821</text>

  <rect x="874" y="330" width="358" height="64" rx="12" fill="#1a2436" stroke="#3a4a63"/>
