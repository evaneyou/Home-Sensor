  <text x="893" y="376" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="13">TCP 8848, pinned TLS</text>

  <rect x="874" y="410" width="358" height="64" rx="12" fill="#1a2436" stroke="#3a4a63"/>
  <text x="893" y="436" fill="#e8eefc" font-family="Nunito, sans-serif" font-size="15" font-weight="700">HTTPS</text>
  <text x="893" y="456" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="13">TCP 443</text>

