  <text x="64" y="238" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="12">Checks leave through the wired or Wi-Fi uplink</text>

  <rect x="68" y="256" width="100" height="64" rx="10" fill="#1a2744" stroke="#5b8def" stroke-width="1.5"/>
