  <text x="64" y="92" fill="#e8eefc" font-family="Nunito, sans-serif" font-size="16" font-weight="700">Home router</text>
  <text x="64" y="114" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="13">Built-in Wi-Fi and LAN switch</text>
  <text x="64" y="132" fill="#8eb4f5" font-family="Nunito, sans-serif" font-size="13">LAN assigned by DHCP</text>

