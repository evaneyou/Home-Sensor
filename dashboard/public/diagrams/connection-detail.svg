  <text x="550" y="298" text-anchor="middle" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="12">scanned, never joined</text>

  <rect x="68" y="360" width="300" height="70" rx="10" fill="#12352c" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="82" y="386" fill="#e8eefc" font-family="Nunito, sans-serif" font-size="14" font-weight="700">WireGuard (wired)</text>
  <text x="82" y="406" fill="#9ee8c8" font-family="Nunito, sans-serif" font-size="12">rides the wired LAN · UDP 51820</text>

  <rect x="68" y="446" width="300" height="70" rx="10" fill="#3a2e12" stroke="#f5b942" stroke-width="1.5"/>
  <text x="82" y="472" fill="#e8eefc" font-family="Nunito, sans-serif" font-size="14" font-weight="700">WireGuard (Wi-Fi)</text>
  <text x="82" y="492" fill="#f5d48a" font-family="Nunito, sans-serif" font-size="12">rides the Wi-Fi client · UDP 51821</text>

  <text x="68" y="546" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="12">Agent check-in is outbound HTTPS on port 8848, with a pinned key.</text>
  <text x="68" y="564" fill="#9aa6c3" font-family="Nunito, sans-serif" font-size="12">No inbound ports are open on the agent.</text>

