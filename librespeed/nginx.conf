server {
    listen 8080;
    client_max_body_size 0;

    location = /garbage.php {
        proxy_pass http://127.0.0.1:8081/backend/garbage;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /empty.php {
        proxy_pass http://127.0.0.1:8081/backend/empty;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /getIP.php {
        proxy_pass http://127.0.0.1:8081/backend/getIP;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
